# Delivery pipeline quality gates (E13-F03-S02): format, lint, types, unit, integration (real
# PostgreSQL), security, build and accessibility. The rating-parity gate joins this pipeline with the
# rating engine increment (E02-F07-S02); releases are immutable images rolled out behind feature flags.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Role guides match the roles and menu
        run: node --import tsx scripts/role-guides.ts --check

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-superuser
          ASTRA_DB_OWNER_PASSWORD: ci-owner
          ASTRA_DB_APP_PASSWORD: ci-app
          KEYCLOAK_DB_PASSWORD: ci-keycloak
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://astra_app:ci-app@localhost:5433/astra_test
      TEST_DATABASE_OWNER_URL: postgres://astra_owner:ci-owner@localhost:5433/astra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Create database roles
        env:
          PGPASSWORD: ci-superuser
          ASTRA_DB_OWNER_PASSWORD: ci-owner
          ASTRA_DB_APP_PASSWORD: ci-app
          KEYCLOAK_DB_PASSWORD: ci-keycloak
          POSTGRES_USER: postgres
        run: |
          sudo apt-get install -y -qq postgresql-client
          sed 's/psql /psql -h localhost -p 5433 /' infra/docker/postgres/init/01-roles.sh > /tmp/roles.sh
          sh /tmp/roles.sh
      - run: node --import tsx scripts/prepare-test-db.ts
      - run: npx vitest run --project integration

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Dependency vulnerabilities (fail on high or critical)
        run: npm run audit:deps
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build

  infrastructure:
    name: Infrastructure templates and images
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - name: Compile the Azure templates and every environment's parameters
        shell: pwsh
        run: ./infra/azure/validate.ps1
      - name: Build the API and worker images
        run: |
          docker build -f infra/docker/Dockerfile --target api -t astra-api:ci .
          docker build -f infra/docker/Dockerfile --target worker -t astra-worker:ci .
      - name: Build the workbench image
        run: docker build -f infra/docker/Dockerfile --target workbench --build-arg OIDC_ISSUER=https://login.example.invalid/v2.0 -t astra-workbench:ci .

